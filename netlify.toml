[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # The recipient is also the contact address intentionally shown on the website.
  # Keep API keys and all other environment values covered by secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "TO_EMAIL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
