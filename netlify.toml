[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # The inquiry recipient is also the intentionally public website contact address.
  # Continue scanning credentials, including RESEND_API_KEY and FROM_EMAIL.
  SECRETS_SCAN_OMIT_KEYS = "TO_EMAIL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
