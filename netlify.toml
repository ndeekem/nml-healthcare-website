[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # The recipient is also the intentionally public contact address on the site.
  # Continue scanning RESEND_API_KEY, FROM_EMAIL, and all other secrets.
  SECRETS_SCAN_OMIT_KEYS = "TO_EMAIL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
