[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Contact addresses are public website content, not credentials.
  # Keep RESEND_API_KEY and all other secrets covered by scanning.
  SECRETS_SCAN_OMIT_KEYS = "FROM_EMAIL,TO_EMAIL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
